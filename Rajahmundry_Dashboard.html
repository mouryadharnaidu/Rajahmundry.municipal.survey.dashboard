const PC=['#d99a00','#1f5fbf','#2e8b57','#a66dd4','#8e99a8','#5f6b7a'],RC=['#2e9e4f','#e69a00','#d64545','#8e99a8'],RN=['Good','Average','Bad','No answer'],GN=['Male','Female','Other'];
const F={d:new Set(D.divs.map((_,i)=>i)),a:new Set(),g:new Set(),c:new Set(),m:new Set()};let tab=0,sk=1,sd=-1;

 const kp=[['Respondents',n],['TDP (Kutami)',pc(q9[0],n)],['YSRCP',pc(q9[1],n)],['Undecided + not said',pc(q9[4]+q9[5],n)],['Govt rated Good',pc(q1[0],n)],['MLA rated Good',pc(q4[0],n)]];

function ranking(){const rs=rows(),H=['Division','n','TDP','YSRCP','INC','Other','Undec.+NR','Leader','Lead (pts)','Govt Good','MLA Good','MLA net'];const T=[];
 D.divs.forEach((d,i)=>{const r=rs.filter(x=>x[0]===i),n=r.length;if(!n)return;const q=cnt(r,7,6).map(v=>Math.round(100*v/n)),o=[0,1,2,3].sort((a,b)=>q[b]-q[a]),g=Math.round(100*cnt(r,4,4)[0]/n),m=cnt(r,5,4),M=Math.round(100*m[0]/n);
